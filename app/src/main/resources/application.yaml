server:
  port: 8050
spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active:
      - local
  mvc:
    apiversion:
      default: v1
      supported: v1
      use:
        header: X-API-VERSION
  http:
    clients:
      connect-timeout: 30s
      read-timeout: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          jws-algorithms: RS256
          audiences:
            - laan-app
            - identity-service
      client:
        registration:
          financial-tracker-client:
            provider: identity
            client-id: financial-tracker-client
            authorization-grant-type: client_credentials
            scope: user:read
        provider:
          identity:
            token-uri: http://localhost:9000/oauth2/token

app:
  clients:
    identity-service:
      base-url: http://localhost:9000/api
      client-id: financial-tracker-client