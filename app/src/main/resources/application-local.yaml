spring:
  datasource:
    url: jdbc:h2:file:./data/expense-tracker-db;DB_CLOSE_ON_EXIT=FALSE;
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: RS256
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          audiences:
            - test-client
            - zeny-app-password
            - identity-service
      client:
        registration:
          zeny-client:
            provider: identity
            client-id: zeny-service
            client-secret: 123456
            authorization-grant-type: client_credentials
            scope: user:read
        provider:
          identity:
            issuer-uri: http://localhost:9000

logging:
  level:
    org.zalando.logbook: TRACE
    com.fabiankevin.app: DEBUG
    com.github.fabiankevin: DEBUG
    springframework.security: DEBUG

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false