spring:
  datasource:
    url: jdbc:h2:file:./data/expense-tracker-db;DB_CLOSE_ON_EXIT=FALSE;
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          financial-tracker-client:
            client-secret: 123456

logging:
  level:
    org.zalando.logbook: TRACE
    com.fabiankevin.app: DEBUG
    com.github.fabiankevin: DEBUG
    springframework.security: DEBUG

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false