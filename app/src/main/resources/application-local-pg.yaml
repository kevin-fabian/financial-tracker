spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/financial_tracker_db
    driver-class-name: org.postgresql.Driver
    username: financial_tracker_apps
    password: financial_tracker_apps
    hikari:
      schema: financial_tracker_schema
      maximum-pool-size: 10
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          financial-tracker-client:
            client-secret: 123456

logging:
  level:
    org.zalando.logbook: INFO
    com.fabiankevin.app: INFO

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false